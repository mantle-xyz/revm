[advisories]
version = 2
yanked = "warn"
ignore = [
    # https://rustsec.org/advisories/RUSTSEC-2024-0436 paste is unmaintained
    "RUSTSEC-2024-0436",
    # https://rustsec.org/advisories/RUSTSEC-2026-0173 proc-macro-error2 is unmaintained
    "RUSTSEC-2026-0173",
    # [MANTLE] https://rustsec.org/advisories/RUSTSEC-2026-0387 crypto-bigint 0.5 timing variability.
    # Fixed only in 0.7.6; 0.5 comes in through k256/elliptic-curve 0.13. revm uses k256 for
    # ecrecover, whose inputs are all public, so there is no secret to leak. Drop once k256 moves on.
    "RUSTSEC-2026-0387",
    # [MANTLE] https://rustsec.org/advisories/RUSTSEC-2026-0441 pin-utils is unmaintained (no
    # vulnerability, no safe upgrade); pulled in by hyper via reqwest.
    "RUSTSEC-2026-0441",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[licenses]
confidence-threshold = 0.9

allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "LGPL-3.0-or-later",
]

exceptions = [
    # ring
    { allow = ["LicenseRef-ring"], name = "ring" },
]

[[licenses.clarify]]
name = "ring"
expression = "LicenseRef-ring"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
